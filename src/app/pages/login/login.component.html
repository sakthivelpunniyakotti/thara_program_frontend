
<section class="vh-100 custom-center custome-background pointer">

    <div class="container bg-dark border-light w-25 rounded d-flex align-item-center justify-content-center flex-column bg-light border border-secondary text-light">
         <div class="row align-items-center">
  
  <!-- Left: Program Name -->
  <div class="col">
    <p class="h3 mb-0">Thara Guru</p>
  </div>

  <!-- Right: Logo -->
  <div class="col-auto d-flex justify-content-end">
    <div class="logo">
      <div class="button__circle">
        <svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <!-- Background Glow -->
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#1e2a47" stop-opacity="1"/>
      </radialGradient>
  
      <!-- Glow -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
  
      <!-- Circle path -->
      <path id="circlePath"
        d="M300,300
           m-250,0
           a250,250 0 1,1 500,0
           a250,250 0 1,1 -500,0"/>
    </defs>
  
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bgGlow)" />
  
    <!-- STAR (extended top tail) -->
    <polygon
      points="
        300,10
        360,250
        520,250
        380,340
        430,500
        300,390
        170,500
        220,340
        80,250
        240,250
      "
      fill="#ff2e2e"
      stroke="white"
      stroke-width="4"
      filter="url(#glow)"
    />
  
    <!-- Center Text -->
    <text x="300" y="310"
          text-anchor="middle"
          font-size="42"
          font-weight="bold"
          fill="white"
          font-family="serif">
      THARA
    </text>
  
    <!-- TOP DOT (aligned with star tip) -->
    
  
    <!-- Circular Text (perfectly centered start at top) -->
    <text font-size="24" fill="white" font-family="sans-serif" letter-spacing="4">
      <textPath href="#circlePath" startOffset="0%" text-anchor="start">
         TENDER HOME FOR ANAW   IM REST AND AWAKENING
      </textPath>
    </text>
  
  </svg>
      </div>
    </div>
  </div>

</div>
         <div class="row">
            <div class="col">
                <p class="h4 text-center"><button (click)="switchTo('students')" [ngClass]="{'btn-secondary':loginAs=='students','text-white':loginAs=='students'}" class="btn btn-outline-secondary">Students</button></p>
            </div>
            <div class="col">
                <p class="h4 text-center"><button (click)="switchTo('others')" [ngClass]="{'btn-secondary':loginAs=='others','text-white':loginAs=='others'}" class="btn btn-outline-secondary">Others</button></p>
            </div>
         </div>
         <div class="row">
            @switch(loginAs){
                @case('students'){
                    <div class="col">
                        <div class="row">
                            <form [formGroup]="studentsForm" (ngSubmit)="authendicateUser('students')">
                                <label for="userName" class="form-label">User Name</label>
                                <span class="text-danger">*</span>
                                <input type="text" class="form-control" [ngClass]="{error:studentsForm.get('userName')?.invalid && studentsForm.get('userName')?.touched}" formControlName="userName">
                                <label for="userName" class="form-label">Id</label>
                                <span class="text-danger">*</span>
                                <input type="text"  class="form-control" [ngClass]="{error:studentsForm.get('id')?.invalid && studentsForm.get('id')?.touched}" formControlName="id">
                                <label for="userName" class="form-label">Grade</label>
                                <span class="text-danger">*</span>
                                <select class="form-select" aria-label="Default select example" [ngClass]="{error:studentsForm.get('grade')?.invalid && studentsForm.get('grade')?.touched}" formControlName="grade">
                                    <option value="" >Select Grade</option>
                                    @for(grade of grades;track grade){
                                        <option [value]="grade.value">{{grade.value}}</option>
                                    }
                                </select>
                            </form>
                        </div>   
                    </div>
                }
                @case('others'){
                    <div class="col">
                        <div class="row">
                            <form [formGroup]="othersForm" (ngSubmit)="authendicateUser('others')">
                                <label for="userName" class="form-label">User Name</label>
                                <span class="text-danger">*</span>
                                <input type="text"  class="form-control" [ngClass]="{error:othersForm.get('userName')?.invalid && othersForm.get('userName')?.touched}" formControlName="userName">
                                <label for="userName" class="form-label">Password</label>
                                <span class="text-danger">*</span>
                                <div class="input-group">
                                <input #passwordInput type="password" [ngClass]="{error:othersForm.get('password')?.invalid && othersForm.get('password')?.touched}" class="form-control" placeholder="Enter Password" formControlName="password">
                                <button type="button" (click)="toggleEye(passwordInput)" class="btn btn-outline-secondary"><i [ngClass]="{'bi-eye':passwordInput.type == 'text'}" class="bi bi-eye-slash"></i></button>
                                </div>
                                <!-- <input type="password" class="form-control"  formControlName="password"> -->
                                <label for="userName" class="form-label">Role</label>
                                <span class="text-danger">*</span>
                                 <select class="form-select" aria-label="Default select example" [ngClass]="{error:othersForm.get('role')?.invalid && othersForm.get('role')?.touched}" formControlName="role">
                                        <option value="">Select Role</option>
                                    @for(role of roles;track role){
                                        <option [value]="role.value">{{role.value | titlecase}}</option>
                                    }
                                 </select>
                            </form>
                        </div>
                    </div>
                }
            }
         </div>
        <div class="row">
          @if(loginAs == 'students'){
            <div class="col text-center">
                <button type="submit" [disabled]="studentsForm.invalid" class="btn  m-3  btn-outline-light" (click)="authendicateUser(loginAs)">Login</button>
            </div>
          }
            @else{
              <div class="col text-center">
                  <button type="submit" [disabled]="othersForm.invalid" class="btn  m-3  btn-outline-light" (click)="authendicateUser(loginAs)">Login</button>
              </div>
            }
        </div>
    </div>
</section>
